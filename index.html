<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything at
     all: without it the page is laid out inside the safe area and every inset
     resolves to 0, so the HUD corners, the READY gate and the joystick clamp in
     css/main.css / js/controls.js would all be silently no-ops on a notched
     phone. With it the page owns the full glass and each of those puts itself
     back inboard by exactly the inset it is given. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flywheel - A sprocket's story</title>
<link rel="stylesheet" href="css/main.css">
<!-- Multiplayer front door (#mp-link, styled here rather than in css/main.css so
     the whole feature lives in this one file). The arena (arena.html) was only
     reachable by typing its URL; this puts it on the title screen. It borrows
     the free-play chip vocabulary from main.css — same dark plate, gold accent
     bar, gold hover — so it reads as one more place to play, not a bolt-on.
     Visibility is CSS-only: hidden by default, shown while the landing screen
     (.fw-landing, built by js/ui/screens.js showTitle) is in #screen-root. So
     it exists ONLY on the title screen — never over gameplay, the HUD, pause,
     shop, or the boot splash — with no JS and no hook into the state machine.
     On browsers too old for :has() it simply stays hidden, which fails safe.
     z-index 30 clears #screen-root's 20 and stays under #boot-splash's 100. -->
<style>
#mp-link {
  position: absolute;
  top: calc(14px + var(--sai-top, 0px));
  right: calc(14px + var(--sai-right, 0px));
  z-index: 30;
  display: none;
  flex-direction: column; gap: 2px;
  text-decoration: none; text-align: left; cursor: pointer;
  overflow: hidden;
  background: var(--fw-plate, rgba(12, 16, 28, .92)); color: #fff;
  border: 2px solid rgba(255, 255, 255, .26); border-radius: 12px;
  padding: 9px 14px 9px 19px; /* extra 5px on the left clears the accent bar */
  box-shadow: 0 4px 0 rgba(0,0,0,.45);
}
body:has(#screen-root .fw-landing) #mp-link { display: flex; }
#mp-link::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: var(--fw-gold, #ffd23f);
}
#mp-link:hover { border-color: var(--fw-gold, #ffd23f); background: rgba(26, 32, 50, .95); }
#mp-link:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.45); }
#mp-link:focus-visible { outline: 3px solid var(--fw-gold, #ffd23f); outline-offset: 3px; }
.mp-row { display: flex; align-items: center; gap: 7px; }
.mp-name { font-weight: 900; letter-spacing: 1.1px; font-size: clamp(13px, 2.2vw, 15px); }
/* Same gold tag as the chips' START HERE pill: it is the recommendation voice. */
.mp-tag {
  background: var(--fw-gold, #ffd23f); color: #4a3200; border-radius: 7px;
  padding: 1px 7px; font-size: 10px; font-weight: 900; letter-spacing: 1.3px;
}
.mp-sub { font-size: clamp(11px, 1.9vw, 12.5px); font-weight: 600; opacity: .7; }
/* Narrow portrait: the wordmark needs the width, so the plate collapses to its
   name row; phone landscape (~390px tall) tightens like the chips do. */
@media (max-width: 700px) {
  #mp-link { padding: 8px 12px 8px 17px; }
  .mp-sub { display: none; }
}
/* Narrow PORTRAIT is the collision case and it is structural, not cosmetic: the
   plate is pinned to the right edge, the sprocket is centred, and below ~640px
   their boxes simply intersect — no amount of trimming the plate moves it out of
   the mark's way, because the mark grows with the viewport too. So the plate
   stops being a corner badge and becomes the screen's top rail: full width,
   above everything, one row. The landing screen reserves the band it occupies
   (see .fw-landing's padding-top in css/main.css under the same breakpoint), so
   nothing in the header stack can sit under it at any width. 44px minimum so it
   is still a thumb target. */
@media (max-width: 640px) and (orientation: portrait) {
  #mp-link {
    top: calc(10px + var(--sai-top, 0px));
    right: calc(12px + var(--sai-right, 0px));
    left: calc(12px + var(--sai-left, 0px));
    flex-direction: row; align-items: center; justify-content: center;
    min-height: 44px; padding: 0 14px 0 19px; gap: 0;
  }
}
@media (orientation: landscape) and (max-height: 480px) {
  #mp-link {
    top: calc(8px + var(--sai-top, 0px)); right: calc(8px + var(--sai-right, 0px));
    padding: 6px 11px 6px 16px;
  }
  .mp-sub, .mp-tag { display: none; }
}
</style>
<!-- three is VENDORED, not fetched. It used to point at cdn.jsdelivr.net, which
     made a third-party host a hard dependency of the boot: when that fetch failed
     (observed live as ERR_CONNECTION_RESET, succeeded on retry minutes later) no
     module in js/ ever evaluated, nothing removed #boot-splash, and the game sat
     on LOADING… forever with no error. Conference/venue wifi makes that likely,
     not theoretical. js/vendor/ holds third-party code that ships as-is and is
     never edited, which keeps it out of the hand-authored js/ namespace while
     still being a plain same-origin path this no-build static site can serve.
     Pinned at 0.160.0; tools/validate.mjs fails the build if this ever points
     off-origin again. -->
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <!-- Boot splash: pure HTML/CSS, no JS dependency, so a slow module/CDN load
       never reads as a crashed tab (playtest finding — 10-15 s of black on cold
       load). main.js removes it right before the first screen mounts. -->
  <div id="boot-splash">FLYWHEEL<span>LOADING…</span></div>
  <canvas id="game-canvas"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="level-banner">LEVEL 1 - SUBURBS</div>
      <div id="mass-bar-wrap"><div id="mass-bar"></div></div>
      <div id="mass-label">0 collected</div>
      <div id="combo-label" class="hidden"></div>
      <!-- Sandbox score plate. Sits under the goal readout because the score is
           read constantly rather than glanced at on an event, and it is the
           quietest of the three tracks in motion and the loudest in size.
           Hidden outside body.mode-sandbox by CSS, not by JS. -->
      <div id="score-plate">
        <span id="score-label">SCORE</span>
        <span id="score-value">0</span>
      </div>
    </div>
    <div id="hud-right">
      <button id="btn-mute" class="round-btn" title="Sound">&#128266;</button>
      <!-- CSS-drawn bars, not a text glyph: ❙❙ fell back to a missing-glyph
           box on systems without that codepoint (playtest finding). -->
      <button id="btn-pause" class="round-btn" title="Pause"><span class="pause-glyph"><span></span><span></span></span></button>
      <!-- The level clock (R-1.2). Its own pill rather than a second job for
           #timer, which the sandbox already uses as the coin readout — one
           element cannot be both without one of them disappearing. Above the
           coin pill because the clock is the thing that ends the run.
           aria-live="off": it changes every frame and a polite live region
           would queue a screen reader announcement per second.

           THE RUN paints this pill too (T-504). It used to write its countdown
           into #timer below, which left this one hidden and the coin readout
           destroyed for the length of the run — one element doing two jobs,
           exactly as this comment warned. -->
      <div id="level-clock" class="hidden" role="timer" aria-live="off">3:00</div>
      <!-- Empty, not "75". That was the start value of the campaign clock ramp
           R-1.1 retired, so the HUD shipped holding a number no mode counts
           down from any more; the sandbox overwrites it with the coin readout
           on its first frame and the campaign with its own countdown. -->
      <div id="timer"></div>
      <!-- Combo meter: radial, on the right, away from the goal stack on the
           left — the separation is what makes the two tellable apart in
           peripheral vision, and it is what gives the meter room to be a ring
           rather than another pill. The arc drains over the 1.5 s combo window,
           which teaches the rule without a word of tutorial. Persistent: it
           rests rather than hiding, so its position is learnable. -->
      <div id="combo-meter">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="cm-track" cx="50" cy="50" r="42"></circle>
          <circle class="cm-arc" cx="50" cy="50" r="42"></circle>
        </svg>
        <!-- Three lines, and the middle one is the point: the big number is a
             CHAIN COUNT, not a multiplier. Unlabelled it was the visually
             dominant readout in the HUD at 18-26px against the honest
             multiplier's 10-13px, so "my combo hit 530" was the number players
             carried away and read as 530x (audit B2, T-310). -->
        <div class="cm-readout">
          <span id="cm-chain">0</span>
          <span class="cm-unit">CHAIN</span>
          <span id="cm-mult">x1</span>
        </div>
      </div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>
    <!-- First-run touch hint. Lives inside #hud on purpose: #hud is
         pointer-events:none and is faded out under the READY gate and hidden on
         every menu, so the hint inherits all of that and js/controls.js only has
         to decide whether it has been earned. Shown once per device on a coarse
         pointer, retired by the first touch. -->
    <div id="touch-hint" class="hidden">
      <div class="th-ring"><div class="th-knob"></div></div>
      <div class="th-label">Drag to steer</div>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="big-pop" class="hidden"></div>
    <!-- Consumption band: the loudest of the three vocabularies, and the only
         thing this package ever puts across the middle of the screen. Full
         width, transient, and pointer-transparent so it can never take a touch
         meant for the world underneath it. -->
    <div id="hype-band" class="hidden"><span id="hype-text"></span></div>
  </div>
  <div id="screen-root"></div>
  <!-- Multiplayer front door — styling and visibility rules in the <style>
       block in <head>. A plain link on purpose: the arena is its own page with
       its own loop, so navigation IS the correct transition, no action needed
       from js/main.js. /arena (extensionless) is served by vercel.json's
       cleanUrls; arena.html itself is untouched. -->
  <a id="mp-link" href="/arena">
    <span class="mp-row">
      <span class="mp-name">MULTIPLAYER</span>
      <span class="mp-tag">2P</span>
    </span>
    <span class="mp-sub">Race a rival online · room codes</span>
  </a>
</div>
<!-- Boot watchdog. Deliberately a CLASSIC inline script, not a module and not an
     import: the failure it exists to report is "module loading itself broke", so
     anything that needs the module graph to run is useless here. It is inline for
     the same reason — a separate file is one more fetch that can be the thing
     that failed.

     The splash covers the slow case; this covers the FAILED case. Two triggers:

       (a) 20 s elapsed and #boot-splash is still in the DOM. The splash comment
           above cites 10-15 s cold loads from playtest, so anything at or under
           that would fire on a working-but-slow boot and tell the player a lie.
           20 s clears the observed worst case with margin while still being
           inside the span a person will actually keep waiting. The engine is
           same-origin now, so a real cold load is well under this.

       (b) an uncaught error or rejection while the splash is still up. A hard
           module failure surfaces immediately rather than making the player wait
           out the full 20 s for news that already arrived.

     js/main.js is NOT modified and does not know this exists. The contract runs
     one way: main.js removes #boot-splash when the first screen can mount, and
     every path here re-queries the live DOM for that element and does nothing if
     it is gone. There is no shared reference to go stale and no ordering to get
     wrong — after a successful boot the element is absent, so a later gameplay
     error hits the same guard and is correctly ignored. -->
<script>
(function () {
  var TIMEOUT_MS = 20000;
  var done = false;
  function bootFailed() {
    if (done) return;
    var splash = document.getElementById('boot-splash');
    if (!splash) { done = true; return; }   // main.js got there — boot is fine
    done = true;
    var line = splash.querySelector('span');
    if (!line) { line = document.createElement('span'); splash.appendChild(line); }
    line.textContent = 'The game could not start. Please reload the page to try again.';
    line.style.opacity = '1';
    line.style.letterSpacing = '1px';
    line.style.maxWidth = '22em';
    line.style.textAlign = 'center';
    line.style.lineHeight = '1.5';
  }
  // Capture phase on purpose: a module script that cannot fetch itself (or its
  // "three" import) fires a NON-bubbling error on the <script> element, which a
  // plain bubble-phase window listener never sees — and that is precisely the
  // failure being watched for. Capture also surfaces every other resource error,
  // so the target is filtered: element targets count only when they are the
  // script tag, while a genuine uncaught exception (target === window) always
  // does. Without that filter a single missing texture would claim the whole
  // game had failed to start.
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName !== 'SCRIPT') return;
    bootFailed();
  }, true);
  window.addEventListener('unhandledrejection', bootFailed);
  setTimeout(bootFailed, TIMEOUT_MS);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
