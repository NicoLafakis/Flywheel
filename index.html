<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything at
     all: without it the page is laid out inside the safe area and every inset
     resolves to 0, so the HUD corners, the READY gate and the joystick clamp in
     css/main.css / js/controls.js would all be silently no-ops on a notched
     phone. With it the page owns the full glass and each of those puts itself
     back inboard by exactly the inset it is given. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flywheel - A sprocket's story</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23121722' stroke='%23ffd23f' stroke-width='2'/%3E%3Cpath d='M16 4l2 4 4-2 1 4 4-1 0 4 4 1-1 4 3 2-2 4 2 3-3 2 1 4-4 1 0 4-4-1-1 4-4-2-2 4-2-4-4 2-1-4-4 1 0-4-4-1 1-4-3-2 2-4-2-3 3-2-1-4 4-1 0-4 4 1 1-4 4 2z' fill='%23ffd23f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23121722'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/multiplayer.css">
<link rel="stylesheet" href="css/help.css">

<!-- three is VENDORED, not fetched. It used to point at cdn.jsdelivr.net, which
     made a third-party host a hard dependency of the boot: when that fetch failed
     (observed live as ERR_CONNECTION_RESET, succeeded on retry minutes later) no
     module in js/ ever evaluated, nothing removed #boot-splash, and the game sat
     on LOADING… forever with no error. Conference/venue wifi makes that likely,
     not theoretical. js/vendor/ holds third-party code that ships as-is and is
     never edited, which keeps it out of the hand-authored js/ namespace while
     still being a plain same-origin path this no-build static site can serve.
     Pinned at 0.160.0; tools/validate.mjs fails the build if this ever points
     off-origin again. -->
<link rel="modulepreload" href="./js/main.js">
<link rel="modulepreload" href="./js/vendor/three.module.js">
<link rel="modulepreload" href="./js/ui/screens.js">
<!-- The menu theme, warmed before any module evaluates. `as="audio"` is
     load-bearing: the preload cache is keyed by request destination, so an
     as="fetch" entry (what this used to be) is never matched by the <audio>
     element js/audio/music.js arms, and the track downloaded twice while the
     console warned "preloaded but not used". No `crossorigin` either — this
     file is same-origin and the audio element issues no CORS request, so a
     crossorigin entry lands in a cache partition nothing here reads.
     js/audio/music.test.mjs asserts both attributes. -->
<link rel="preload" href="./assets/music/main-menu.mp3" as="audio" type="audio/mpeg">
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js" } }
</script>
</head>
<body>
  <!-- Boot splash: animated progress bar with counting percentage, active status, and brand wordmark.
       Removed smoothly by main.js once the initial engine, shaders and background scene are ready. -->
  <div id="boot-splash">
    <div class="boot-brand">
      <div class="boot-logo">⚙️</div>
      <div class="boot-title">FLYWHEEL</div>
      <div class="boot-tagline">A SPROCKET'S STORY</div>
    </div>
    <div class="boot-loader-box">
      <div class="boot-track">
        <div id="boot-progress-bar" class="boot-fill" style="width: 0%;">
          <div class="boot-shimmer"></div>
        </div>
      </div>
      <div class="boot-meta">
        <span id="boot-status-text">INITIALIZING ENGINE…</span>
        <span id="boot-percentage-text">0%</span>
      </div>
    </div>
    <span class="boot-fallback-label" style="display:none">LOADING…</span>
  </div>
  <canvas id="game-canvas"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="level-banner">LEVEL 1 · SUBURBS</div>
      <div id="mass-bar-wrap"><div id="mass-bar"></div></div>
      <div id="mass-label">0 collected</div>
      <div id="combo-label" class="hidden"></div>
      <!-- Sandbox score plate. Sits under the goal readout because the score is
           read constantly rather than glanced at on an event, and it is the
           quietest of the three tracks in motion and the loudest in size.
           Hidden outside body.mode-sandbox by CSS, not by JS. -->
      <div id="score-plate">
        <span id="score-label">SCORE</span>
        <span id="score-value">0</span>
      </div>
    </div>
    <!-- The level clock (R-1.2). Positioned top-center as the primary focal constraint.
         aria-live="off": it changes every frame and a polite live region
         would queue a screen reader announcement per second. -->
    <div id="level-clock" class="hidden" role="timer" aria-live="off">3:00</div>
    <!-- Endgame remaining blocks counter (displays when <= 100 blocks remain or <= 30s left) -->
    <div id="blocks-left-pill" class="hidden" aria-live="polite">
      <span class="blocks-left-icon">🎯</span>
      <span id="blocks-left-text">98 BLOCKS LEFT</span>
    </div>
    <div id="hud-right">
      <div id="hud-controls-row">
        <!-- Empty, not "75". That was the start value of the campaign clock ramp
             R-1.1 retired, so the HUD shipped holding a number no mode counts
             down from any more; the sandbox overwrites it with the coin readout
             on its first frame and the campaign with its own countdown. -->
        <div id="timer"></div>
        <button id="btn-mute" class="round-btn" title="Sound">&#128266;</button>
        <!-- CSS-drawn bars, not a text glyph: ❙❙ fell back to a missing-glyph
             box on systems without that codepoint (playtest finding). -->
        <button id="btn-pause" class="round-btn" title="Pause"><span class="pause-glyph"><span></span><span></span></span></button>
      </div>
      <!-- Combo meter: radial, on the right, away from the goal stack on the
           left — the separation is what makes the two tellable apart in
           peripheral vision, and it is what gives the meter room to be a ring
           rather than another pill. The arc drains over the 1.5 s combo window,
           which teaches the rule without a word of tutorial. Persistent: it
           rests rather than hiding, so its position is learnable. -->
      <div id="combo-meter">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="cm-track" cx="50" cy="50" r="42"></circle>
          <circle class="cm-arc" cx="50" cy="50" r="42"></circle>
        </svg>
        <!-- Three lines, and the middle one is the point: the big number is a
             CHAIN COUNT, not a multiplier. Unlabelled it was the visually
             dominant readout in the HUD at 18-26px against the honest
             multiplier's 10-13px, so "my combo hit 530" was the number players
             carried away and read as 530x (audit B2, T-310). -->
        <div class="cm-readout">
          <span id="cm-chain">0</span>
          <span class="cm-unit">CHAIN</span>
          <span id="cm-mult">x1</span>
        </div>
        <!-- Combo burst overlay covering the combo meter +20% with anime style -->
        <div id="cm-burst" class="cm-burst hidden">
          <div class="cm-burst-halo"></div>
          <div class="cm-burst-ring"></div>
          <div class="cm-burst-body">
            <span id="cm-burst-mult" class="cm-burst-mult">2X</span>
            <span id="cm-burst-sub" class="cm-burst-sub">COMBO!</span>
          </div>
        </div>
      </div>
      <div id="active-powerups"></div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>
    <!-- First-run touch hint. Lives inside #hud on purpose: #hud is
         pointer-events:none and is faded out under the READY gate and hidden on
         every menu, so the hint inherits all of that and js/controls.js only has
         to decide whether it has been earned. Shown once per device on a coarse
         pointer, retired by the first touch. -->
    <div id="touch-hint" class="hidden">
      <div class="th-ring"><div class="th-knob"></div></div>
      <div class="th-label">Drag to steer</div>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="big-pop" class="hidden">
      <div class="big-pop-content">
        <div id="big-pop-sub" class="big-pop-sub">✦ EXPANDING VORTEX ✦</div>
        <div id="big-pop-text" class="big-pop-text">SIZE 2!</div>
      </div>
    </div>
    <!-- Anime Power-Up Active Screen Overlays -->
    <div id="chrono-freeze-overlay" class="chrono-freeze-overlay hidden">
      <div class="freeze-vignette"></div>
      <div class="freeze-crystals"></div>
      <div class="freeze-shimmer"></div>
      <div class="freeze-badge">❄️ TIME FROZEN ❄️</div>
    </div>
    <div id="vortex-suction-overlay" class="vortex-suction-overlay hidden">
      <div class="vortex-lens-warp"></div>
      <div class="vortex-inward-rays"></div>
    </div>
    <div id="titan-surge-overlay" class="titan-surge-overlay hidden">
      <div class="titan-shock-flash"></div>
      <div class="titan-impact-badge">
        <span class="titan-impact-sub">MAXIMUM OVERDRIVE</span>
        <span class="titan-impact-title">TITAN GIGA-SURGE</span>
      </div>
    </div>
    <div id="speed-frenzy-overlay" class="speed-frenzy-overlay hidden">
      <div class="speed-lightning-left"></div>
      <div class="speed-lightning-right"></div>
      <div class="speed-tunnel-lines"></div>
    </div>
    <div id="chain-frenzy-overlay" class="chain-frenzy-overlay hidden">
      <div class="chain-dragon-fire"></div>
      <div class="chain-spark-burst"></div>
    </div>
    <!-- Consumption band: the loudest of the three vocabularies, and the only
         thing this package ever puts across the middle of the screen. Full
         width, transient, and pointer-transparent so it can never take a touch
         meant for the world underneath it. -->
    <div id="hype-band" class="hidden">
      <div class="hype-anime-container">
        <div class="hype-speed-streak"></div>
        <div class="hype-content-wrap">
          <div id="hype-sub" class="hype-sub hidden"></div>
          <div id="hype-text" class="hype-text"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="screen-root"></div>

</div>
<!-- Boot watchdog. Deliberately a CLASSIC inline script, not a module and not an
     import: the failure it exists to report is "module loading itself broke", so
     anything that needs the module graph to run is useless here. It is inline for
     the same reason — a separate file is one more fetch that can be the thing
     that failed.

     The splash covers the slow case; this covers the FAILED case. Two triggers:

       (a) 20 s elapsed and #boot-splash is still in the DOM. The splash comment
           above cites 10-15 s cold loads from playtest, so anything at or under
           that would fire on a working-but-slow boot and tell the player a lie.
           20 s clears the observed worst case with margin while still being
           inside the span a person will actually keep waiting. The engine is
           same-origin now, so a real cold load is well under this.

       (b) an uncaught error or rejection while the splash is still up. A hard
           module failure surfaces immediately rather than making the player wait
           out the full 20 s for news that already arrived.

     js/main.js is NOT modified and does not know this exists. The contract runs
     one way: main.js removes #boot-splash when the first screen can mount, and
     every path here re-queries the live DOM for that element and does nothing if
     it is gone. There is no shared reference to go stale and no ordering to get
     wrong — after a successful boot the element is absent, so a later gameplay
     error hits the same guard and is correctly ignored. -->
<script>
(function () {
  var TIMEOUT_MS = 25000;
  var done = false;
  var visualPct = 0;
  var targetPct = 15;
  var statusText = 'INITIALIZING ENGINE…';
  var isSceneReady = false;
  var startTime = performance.now();
  var MIN_BOOT_DURATION_MS = 1400; // Guarantees a rhythmic, polished 1.4s progression

  var fillEl = document.getElementById('boot-progress-bar');
  var pctEl = document.getElementById('boot-percentage-text');
  var statEl = document.getElementById('boot-status-text');
  var splashEl = document.getElementById('boot-splash');

  function updateDisplay() {
    var rounded = Math.min(100, Math.max(0, Math.round(visualPct)));
    if (fillEl) fillEl.style.width = rounded + '%';
    if (pctEl) pctEl.textContent = rounded + '%';
    if (statEl && statusText) statEl.textContent = statusText;
  }

  function step(now) {
    if (done) return;
    var elapsed = now - startTime;
    var timeRatio = Math.min(1, elapsed / MIN_BOOT_DURATION_MS);

    // Progression combines minimum time-pacing with actual subsystem milestones
    var targetCeil = isSceneReady ? 100 : 92;
    var baselinePct = Math.min(targetCeil, Math.round(timeRatio * targetCeil));
    var effectiveTarget = Math.max(targetPct, baselinePct);

    if (visualPct < effectiveTarget) {
      var delta = effectiveTarget - visualPct;
      var speed = Math.max(0.35, delta * 0.1);
      visualPct = Math.min(effectiveTarget, visualPct + speed);
      updateDisplay();
    }

    if (isSceneReady && visualPct >= 99.5) {
      visualPct = 100;
      updateDisplay();
      done = true;
      if (statEl) statEl.textContent = 'READY TO ROLL!';
      setTimeout(function () {
        if (splashEl) {
          splashEl.classList.add('fade-out');
          setTimeout(function () {
            if (splashEl && splashEl.parentNode) splashEl.remove();
          }, 450);
        }
      }, 220);
      return;
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  window.__setBootProgress = function(pct, status) {
    targetPct = Math.max(targetPct, pct);
    if (status) statusText = status;
    if (pct >= 100) {
      isSceneReady = true;
    }
  };

  // The menu theme used to be pre-warmed here with a throwaway Audio element.
  // It is gone on purpose: this was a THIRD fetch of the same file (after the
  // <link rel=preload> above and the director's own element), into an element
  // nothing ever played from. js/audio/music.js now arms its real element the
  // moment js/main.js requests the menu cue, which is the same boot instant,
  // and that fetch is the one the preload link above serves. One download.

  function bootFailed(err) {
    if (done) return;
    console.error('[Boot Error Diagnostics]:', err);
    var splash = document.getElementById('boot-splash');
    if (!splash) { done = true; return; }
    done = true;
    var line = splash.querySelector('.boot-fallback-label') || splash.querySelector('span');
    if (!line) { line = document.createElement('span'); splash.appendChild(line); }
    line.style.display = 'block';
    line.textContent = 'The game could not start. Please reload the page to try again.';
    line.style.opacity = '1';
    line.style.letterSpacing = '1px';
    line.style.maxWidth = '22em';
    line.style.textAlign = 'center';
    line.style.lineHeight = '1.5';
    if (statEl) {
      statEl.textContent = 'LOAD ERROR';
      statEl.style.color = '#ff3355';
    }
  }

  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName !== 'SCRIPT') return;
    bootFailed(e.error || e.message || e);
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    // Ignore benign audio autoplay and network sync rejections
    var reason = e ? (e.reason || e) : null;
    var msg = reason && (reason.message || reason.name || String(reason));
    if (msg && (msg.includes('NotAllowedError') || msg.includes('play()') || msg.includes('Failed to fetch') || msg.includes('NetworkError'))) {
      console.warn('[Ignored Benign Rejection on Boot]:', msg);
      return;
    }
    bootFailed(reason);
  });

  setTimeout(function () {
    bootFailed(new Error('Boot sequence timed out after ' + TIMEOUT_MS + 'ms'));
  }, TIMEOUT_MS);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
