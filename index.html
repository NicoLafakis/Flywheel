<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything at
     all: without it the page is laid out inside the safe area and every inset
     resolves to 0, so the HUD corners, the READY gate and the joystick clamp in
     css/main.css / js/controls.js would all be silently no-ops on a notched
     phone. With it the page owns the full glass and each of those puts itself
     back inboard by exactly the inset it is given. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flywheel - A sprocket's story</title>
<link rel="stylesheet" href="css/main.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <!-- Boot splash: pure HTML/CSS, no JS dependency, so a slow module/CDN load
       never reads as a crashed tab (playtest finding — 10-15 s of black on cold
       load). main.js removes it right before the first screen mounts. -->
  <div id="boot-splash">FLYWHEEL<span>LOADING…</span></div>
  <canvas id="game-canvas"></canvas>
  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="level-banner">LEVEL 1 - SUBURBS</div>
      <div id="mass-bar-wrap"><div id="mass-bar"></div></div>
      <div id="mass-label">0 collected</div>
      <div id="combo-label" class="hidden"></div>
    </div>
    <div id="hud-right">
      <button id="btn-mute" class="round-btn" title="Sound">&#128266;</button>
      <!-- CSS-drawn bars, not a text glyph: ❙❙ fell back to a missing-glyph
           box on systems without that codepoint (playtest finding). -->
      <button id="btn-pause" class="round-btn" title="Pause"><span class="pause-glyph"><span></span><span></span></span></button>
      <div id="timer">75</div>
    </div>
    <div id="minimap-wrap"><canvas id="minimap" width="150" height="150"></canvas></div>
    <div id="joystick" class="hidden"><div id="joystick-knob"></div></div>
    <!-- First-run touch hint. Lives inside #hud on purpose: #hud is
         pointer-events:none and is faded out under the READY gate and hidden on
         every menu, so the hint inherits all of that and js/controls.js only has
         to decide whether it has been earned. Shown once per device on a coarse
         pointer, retired by the first touch. -->
    <div id="touch-hint" class="hidden">
      <div class="th-ring"><div class="th-knob"></div></div>
      <div class="th-label">Drag to steer</div>
    </div>
    <div id="toast" class="hidden"></div>
    <div id="big-pop" class="hidden"></div>
  </div>
  <div id="screen-root"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
