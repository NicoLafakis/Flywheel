<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flywheel — Hot Seat</title>
<!-- Same vendored, same-origin three as index.html. No CDN: js/vendor/ is the
     only supply of the engine in this repo and tools/validate.mjs enforces it. -->
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.js" } }
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #11151c;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    color: #e9eef6; user-select: none;
  }
  #duel-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #duel-hud {
    position: fixed; inset: 0; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
    gap: 16px; padding: 18px 22px;
  }
  .plate {
    background: rgba(10, 14, 20, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px; padding: 12px 18px 14px; min-width: 260px;
    backdrop-filter: blur(6px);
  }
  .plate.p2 { justify-self: end; text-align: right; }
  .who { font-size: 13px; letter-spacing: 2.4px; font-weight: 700; opacity: 0.95; }
  .p1 .who { color: #4da3ff; }
  .p2 .who { color: #ff8b2d; }
  .keys { font-size: 11px; letter-spacing: 1.4px; opacity: 0.5; margin-top: 2px; }
  .score {
    font-size: 58px; font-weight: 800; line-height: 1; letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums; margin-top: 4px;
  }
  .sub { font-size: 12px; letter-spacing: 1.2px; opacity: 0.62; margin-top: 3px; }
  .bar-track {
    height: 6px; border-radius: 3px; margin-top: 10px;
    background: rgba(255, 255, 255, 0.09); overflow: hidden;
  }
  .bar { height: 100%; width: 0%; border-radius: 3px; transition: width 0.18s linear; }
  .p1 .bar { background: #4da3ff; }
  .p2 .bar { background: #ff8b2d; margin-left: auto; }

  #duel-timer {
    font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: 1px; padding: 10px 20px; border-radius: 14px;
    background: rgba(10, 14, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.09);
  }
  #duel-timer.urgent { color: #ff4d4d; }

  /* Shared tug-of-war bar (rival-visibility pattern 2): one possession bar
     between the plates. The 3px gap is the non-color boundary cue. */
  #center-stack { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #shared-tug {
    display: flex; gap: 3px; height: 8px; border-radius: 4px; overflow: hidden;
    width: 220px; padding: 1px;
    background: rgba(10, 14, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.09);
  }
  .tug-seg { height: 100%; border-radius: 3px; transition: width 0.35s ease; min-width: 3px; }

  #duel-banner {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(8, 11, 16, 0.86); text-align: center;
  }
  #duel-banner.hidden { display: none; }
  #banner-head { font-size: 54px; font-weight: 800; letter-spacing: -1px; }
  #banner-p1, #banner-p2 { font-size: 20px; letter-spacing: 1.4px; opacity: 0.85; }
  #banner-p1 { color: #4da3ff; }
  #banner-p2 { color: #ff8b2d; }
  #btn-restart {
    margin-top: 22px; pointer-events: auto; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 2px;
    padding: 13px 32px; border-radius: 999px; color: #11151c; background: #e9eef6;
    border: 0;
  }
  #btn-restart:hover { background: #fff; }

  #hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 2px; opacity: 0.35;
  }
</style>
</head>
<body>
<canvas id="duel-canvas"></canvas>

<div id="duel-hud">
  <div class="plate p1">
    <div class="who">PLAYER 1</div>
    <div class="keys">W A S D</div>
    <div class="score" id="p1-score">0</div>
    <div class="sub" id="p1-size">SIZE 1</div>
    <div class="bar-track"><div class="bar" id="p1-bar"></div></div>
  </div>

  <div id="center-stack">
    <div id="duel-timer">3:00</div>
    <div id="shared-tug"></div>
  </div>

  <div class="plate p2">
    <div class="who">PLAYER 2</div>
    <div class="keys">↑ ← ↓ →</div>
    <div class="score" id="p2-score">0</div>
    <div class="sub" id="p2-size">SIZE 1</div>
    <div class="bar-track"><div class="bar" id="p2-bar"></div></div>
  </div>
</div>

<div id="duel-banner" class="hidden">
  <div id="banner-head">—</div>
  <div id="banner-p1">—</div>
  <div id="banner-p2">—</div>
  <button id="btn-restart">PLAY AGAIN</button>
</div>

<div id="hint">ONE CITY · TWO HOLES · THREE MINUTES</div>

<script type="module" src="js/demo/demo.js"></script>
</body>
</html>
